name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: sokkisapp.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: sokkisapp
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: sokkisapp.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1020705470960"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:1020705470960:web:ea4cea0c761d49ce2ec535
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: G-2042K265XB
          EXPO_PUBLIC_GOOGLE_VISION_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_VISION_API_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 1020705470960-3ki9emg74h6emun2nv1eh8cldgp2pn7a.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 1020705470960-h29iavvvn5e1iipg76kdbn8cih7vg5oo.apps.googleusercontent.com

      - name: Copy google-services.json to Android project
        run: cp google-services.json android/app/google-services.json

      - name: Setup signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/sapp-release.keystore
          cat >> android/gradle.properties << 'EOF'
          MYAPP_UPLOAD_STORE_FILE=sapp-release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD=sapp123release
          MYAPP_UPLOAD_KEY_ALIAS=sapp
          MYAPP_UPLOAD_KEY_PASSWORD=sapp123release
          EOF

      - name: Relax Kotlin/Java JVM-target validation (expo-dynamic-app-icon)
        run: |
          grep -q "kotlin.jvm.target.validation.mode" android/gradle.properties \
            || echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

      - name: Inject signing config into build.gradle
        run: |
          python3 << 'PYEOF'
          import re, sys
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()
          PROPS = '\n            storeFile file(project.MYAPP_UPLOAD_STORE_FILE)\n            storePassword project.MYAPP_UPLOAD_STORE_PASSWORD\n            keyAlias project.MYAPP_UPLOAD_KEY_ALIAS\n            keyPassword project.MYAPP_UPLOAD_KEY_PASSWORD'
          if 'MYAPP_UPLOAD_STORE_FILE' not in content:
              rel_cfg = '\n        release {' + PROPS + '\n        }'
              if 'signingConfigs' in content:
                  content = re.sub(r'(signingConfigs\s*\{[^}]*\})', r'\1' + rel_cfg, content, count=1)
                  print('Added release signing config to existing signingConfigs block')
              else:
                  blk = '\n    signingConfigs {' + rel_cfg + '\n    }\n'
                  content = re.sub(r'(\n\s+buildTypes\s*\{)', blk + r'\1', content, count=1)
                  print('Injected full signingConfigs block before buildTypes')
          if 'signingConfig signingConfigs.release' not in content:
              updated = re.sub(r'(buildTypes\s*\{.*?\brelease\s*\{[^}]*?)(signingConfig\s+\S+)', r'\1signingConfig signingConfigs.release', content, count=1, flags=re.DOTALL)
              if updated == content:
                  content = re.sub(r'(buildTypes\s*\{.*?)(\brelease\s*\{)', r'\1\2\n            signingConfig signingConfigs.release', content, count=1, flags=re.DOTALL)
                  print('Added signingConfig reference to release buildType')
              else:
                  content = updated
                  print('Replaced existing signingConfig reference in release buildType')
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          if 'signingConfig signingConfigs.release' not in content or 'MYAPP_UPLOAD_STORE_FILE' not in content:
              print('ERROR: injection incomplete!')
              sys.exit(1)
          print('Signing config OK.')
          PYEOF

      - name: Verify signing config in build.gradle
        run: |
          echo "=== signingConfig lines in build.gradle ==="
          grep -n "signingConfig" android/app/build.gradle
          grep -q "signingConfig signingConfigs.release" android/app/build.gradle \
            && echo "OK: release buildType will use production keystore" \
            || (echo "FAIL: signingConfig.release missing" && exit 1)

      - name: Verify google-services.json placement
        run: |
          echo "--- android/app/google-services.json ---"
          cat android/app/google-services.json | grep -E "package_name|certificate_hash"

      - name: Print keystore SHA-1 (for verification)
        run: keytool -list -v -keystore android/app/sapp-release.keystore -alias sapp -storepass sapp123release 2>&1 | grep "SHA1:"

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease
        env:
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: sokkisapp.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: sokkisapp
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: sokkisapp.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1020705470960"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:1020705470960:web:ea4cea0c761d49ce2ec535
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: G-2042K265XB
          EXPO_PUBLIC_GOOGLE_VISION_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_VISION_API_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 1020705470960-3ki9emg74h6emun2nv1eh8cldgp2pn7a.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 1020705470960-h29iavvvn5e1iipg76kdbn8cih7vg5oo.apps.googleusercontent.com

      - name: Verify APK certificate SHA-1
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "=== APK certificate SHA-1 ==="
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -i "sha"
          echo "Expected: A0:70:35:43:2F:E5:39:44:E2:1F:00:F6:73:8D:AD:A2:7E:EA:FC:88"

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Filename carries the build number AND commit SHA so it is always
          # obvious which build/commit an installed APK came from.
          cp android/app/build/outputs/apk/release/app-release.apk \
            "sapp-build${{ github.run_number }}-v${VERSION}-${SHORT_SHA}.apk"
          echo "Built: sapp-build${{ github.run_number }}-v${VERSION}-${SHORT_SHA}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapp-build${{ github.run_number }}
          path: sapp-build*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            **Build #${{ github.run_number }}**
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
          files: sapp-build*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
