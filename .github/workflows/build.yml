name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyBkE7_6Phyo9C6Mj5c_loYDWDLttqMRbWo
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: sokkisapp.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: sokkisapp
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: sokkisapp.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1020705470960"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:1020705470960:web:ea4cea0c761d49ce2ec535
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: G-2042K265XB
          EXPO_PUBLIC_GOOGLE_VISION_API_KEY: AIzaSyAmP5HZ66UjcEK-cncMFyKZ0p4pNDCeUK4
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 1020705470960-3ki9emg74h6emun2nv1eh8cldgp2pn7a.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 1020705470960-h29iavvvn5e1iipg76kdbn8cih7vg5oo.apps.googleusercontent.com

      - name: Setup signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/sapp-release.keystore
          cat >> android/gradle.properties << 'EOF'
          MYAPP_UPLOAD_STORE_FILE=sapp-release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD=sapp123release
          MYAPP_UPLOAD_KEY_ALIAS=sapp
          MYAPP_UPLOAD_KEY_PASSWORD=sapp123release
          EOF

      - name: Inject signing config into build.gradle
        run: |
          python3 << 'PYEOF'
          import re

          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
              }
          """

          # Insert signingConfigs before buildTypes if not already present
          if 'signingConfigs' not in content:
              content = content.replace('    buildTypes {', signing_config + '    buildTypes {')

          # Set release buildType to use signingConfig
          content = re.sub(
              r'(buildTypes\s*\{[^}]*release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              content,
              count=1
          )

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)

          print("Signing config injected.")
          PYEOF

      - name: Verify google-services.json placement
        run: |
          echo "--- android/app/google-services.json ---"
          cat android/app/google-services.json | grep -E "package_name|certificate_hash"

      - name: Print keystore SHA-1 (for verification)
        run: keytool -list -v -keystore android/app/sapp-release.keystore -alias sapp -storepass sapp123release 2>&1 | grep "SHA1:"

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease
        env:
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyBkE7_6Phyo9C6Mj5c_loYDWDLttqMRbWo
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: sokkisapp.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: sokkisapp
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: sokkisapp.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1020705470960"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:1020705470960:web:ea4cea0c761d49ce2ec535
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: G-2042K265XB
          EXPO_PUBLIC_GOOGLE_VISION_API_KEY: AIzaSyAmP5HZ66UjcEK-cncMFyKZ0p4pNDCeUK4
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 1020705470960-3ki9emg74h6emun2nv1eh8cldgp2pn7a.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 1020705470960-h29iavvvn5e1iipg76kdbn8cih7vg5oo.apps.googleusercontent.com

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk sapp-v${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapp-apk
          path: sapp-v*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: sapp-v*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
